[workspace]
name             = "jamg"
version          = "2.0.0a1"
description      = "JAMg v2 - containerised eukaryotic genome annotation"
authors          = ["Alexie Papanicolaou"]
channels         = ["conda-forge", "bioconda"]
platforms        = ["linux-64"]

[tasks]
lint        = { depends-on = ["lint-py", "lint-perl", "lint-shell", "lint-snakemake"] }
# Lints only paths that exist. Forward-declared paths (src/, tests/jamg/,
# tests/scripts/, workflow/Snakefile) skip cleanly with a notice so the task
# stays green as new phases land.
lint-py = """
  paths=$(for p in src bin tests/jamg tests/scripts; do [ -e "$p" ] && echo "$p"; done | tr '\\n' ' ')
  if [ -z "$paths" ]; then echo 'lint-py: no Python source paths exist yet'; exit 0; fi
  ruff check $paths && pyright $paths
"""
# Perl::Critic is not a conda package; setup-perl-tools installs it via cpanm
# into .pixi/perl5/. Falls back to `perl -c` syntax check when missing.
lint-perl   = """
  if [ -x .pixi/perl5/bin/perlcritic ]; then
    PERL5LIB=.pixi/perl5/lib/perl5 .pixi/perl5/bin/perlcritic --severity 4 bin/ PerlLib/
  else
    echo 'perlcritic not installed; falling back to perl -c syntax check.'
    echo 'Run: pixi run setup-perl-tools to install Perl::Critic into .pixi/perl5/.'
    git ls-files 'bin/*.pl' 'PerlLib/**/*.pm' | xargs -n1 -r perl -Ibin -IPerlLib -c
  fi
"""
lint-shell = """
  files=$(git ls-files '*.sh' 2>/dev/null)
  if [ -z "$files" ]; then echo 'lint-shell: no tracked .sh files'; exit 0; fi
  shellcheck $files
"""
# common.smk runs `validate(config, schema)` at parse time, so --configfile
# is required even for `--lint`.
lint-snakemake = """
  if [ ! -f workflow/Snakefile ]; then
    echo 'lint-snakemake: workflow/Snakefile not yet present'
    exit 0
  fi
  snakemake --snakefile workflow/Snakefile --configfile workflow/config/config.example.yaml --lint
"""
test = """
  for p in tests/jamg tests/workflow tests/scripts; do
    if [ -d "$p" ]; then pytest "$p" || exit $?; else echo "SKIP: $p (forward-decl)"; fi
  done
  for g in tests/golden/*.t tests/scripts/*.t; do
    [ -f "$g" ] && prove "$g" || true
  done
"""
sif         = "make sif"

# bioconda's perl-app-cpanminus pins to perl 5.26, which conflicts with the
# `perl>=5.32` dep below. The upstream fatpacked cpanm avoids that conflict and
# isolates CPAN dists under .pixi/perl5/ so `make clean` wipes them with .pixi.
setup-perl-tools = """
  set -euo pipefail
  mkdir -p .pixi
  if [ ! -x .pixi/cpanm ]; then
    curl -fsSL https://cpanmin.us > .pixi/cpanm
    chmod +x .pixi/cpanm
  fi
  .pixi/cpanm --notest --local-lib .pixi/perl5 Perl::Critic
"""

[dependencies]
python      = ">=3.12"
click       = ">=8.1"
pyyaml      = ">=6"
jsonschema  = ">=4"
pytest      = ">=8"
ruff        = ">=0.5"
pyright     = ">=1.1.380"
shellcheck  = ">=0.10"
snakemake   = ">=9.0,<10.0"
snakemake-executor-plugin-slurm = "*"
perl        = ">=5.32"
perl-test-simple = "*"           # provides Test::More
perl-test-harness = "*"
# perlcritic: NOT a conda package. Installed via `pixi run setup-perl-tools` into .pixi/perl5/.
# `curl` is needed to bootstrap cpanm.
curl        = "*"

[feature.sif.dependencies]
# Slim bioconda set rendered to containers/environment.yml and consumed by
# containers/jamg.def's %post. The four-SIF split keeps heavy/complex tools
# out of conda:
#   - Augustus, EVidenceModeler, TransDecoder, cdbfasta, ParaFly:
#     source-built in containers/post-install.sh.
#   - Trinity, PASA: separate SIFs (containers/trinity.def, pasa.def)
#     pulled from upstream Docker images.
#   - exonerate, emboss, trf, ncbi-blast+, jellyfish, salmon, bowtie2:
#     apt-installed in containers/jamg-base.def.
#   - r-base-core: apt-installed in jamg-base.def.
#
# Conda holds small, modern tools where bioconda is the obvious source and
# the package brings no R / mysql / matplotlib / boost baggage.
# RepeatMasker/RepeatModeler are here because their Dfam + RMBlast
# integration is what bioconda packagers maintain. All pins are exact ==X.Y.Z
# to keep `containers/environment.yml` reproducible.
repeatmasker   = "==4.2.3"
repeatmodeler  = "==2.0.8"
minimap2       = "==2.30"
gmap           = "==2025.07.31"
star           = "==2.7.11b"   # STAR uses letter-suffixed releases;
                               # PEP 440 sorts 2.7.11b < 2.7.11.0.
samtools       = "==1.23.1"
bcftools       = "==1.23.1"
bedtools       = "==2.31.1"
htslib         = "==1.23.1"
gffread        = "==0.12.9"

# Snakemake lives in the SIF so `apptainer exec jamg.sif snakemake ...` works
# on hosts that lack pixi.
snakemake                       = "==9.21.0"
snakemake-executor-plugin-slurm = "==2.6.1"

# Perl modules for JAMg's bin/*.pl. The scripts use `#!/usr/bin/env perl`,
# which resolves to /opt/conda/bin/perl inside the SIF; apt-installed
# system-perl modules at /usr/share/perl5/* are not on conda-perl's @INC.
# These bioconda packages install into /opt/conda/lib/perl5/site_perl/.
perl-bioperl              = "*"
perl-db_file              = "*"
perl-yaml                 = "*"
perl-hash-merge           = "*"
perl-parallel-forkmanager = "*"
perl-mce                  = "*"
perl-json                 = "*"
perl-xml-libxml           = "*"
perl-xml-simple           = "*"
perl-libwww-perl          = "*"
perl-statistics-descriptive = "*"
perl-html-parser          = "*"

[environments]
# `sif` env renders to containers/environment.yml and is the conda layer of
# the SIF. `no-default-feature = true` excludes host-dev dependencies
# (pyright, ruff, pytest, perl-test-*) so the rendered env.yml stays minimal.
sif = { features = ["sif"], no-default-feature = true }
