# Authoritative pin ledger for tools source-compiled in
# containers/post-install.sh. The script must agree with these values.
#
# Tools NOT in this file:
#   - Trinity, PASA: separate SIFs (containers/trinity.def, pasa.def).
#   - exonerate, emboss, trf, ncbi-blast+: apt (debian trixie).
#   - minimap2, gmap, samtools, bcftools, bedtools, gffread, htslib, star,
#     repeatmasker, repeatmodeler: bioconda (containers/environment.yml).

[augustus]
repo   = "https://github.com/Gaius-Augustus/Augustus.git"
# master commit; the v3.5.0 release tag predates the GCC 15.2 fix and fails
# to link. Re-pin to the next tagged release when one is cut.
commit = "cd36870303ec01e8995ebcca90e48bf194ea56e3"

[evidencemodeler]
# Vendored as a JAMg submodule at containers/src/EVidenceModeler. The
# parent-repo submodule SHA is the authoritative pin; this section is
# informational. The fork carries a negative-offset-warn patch on the
# upstream v2.1.0 base (see the submodule's commit log).
submodule = "containers/src/EVidenceModeler"
upstream  = "https://github.com/alpapan/EVidenceModeler.git"

[transdecoder]
repo = "https://github.com/TransDecoder/TransDecoder.git"
tag  = "TransDecoder-v5.7.1"

[cdbfasta]
repo   = "https://github.com/gpertea/cdbfasta.git"
commit = "da8f5ba5"      # no semver releases upstream; commit-pinned

[parafly]
repo   = "https://github.com/ParaFly/ParaFly.git"
commit = "44487e0f"      # no semver releases upstream; commit-pinned
