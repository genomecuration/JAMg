# Perl module deps for JAMg's bin/*.pl scripts. These install into
# /opt/conda/lib/perl5/site_perl/ which IS on conda-perl's @INC (the
# apt-installed system-perl 5.40 modules live in a different prefix and
# aren't visible to conda-perl 5.32).
- perl-bioperl
- perl-db_file
- perl-yaml
- perl-hash-merge
- perl-parallel-forkmanager
- perl-mce
- perl-json
- perl-xml-libxml
- perl-xml-simple
- perl-libwww-perl
- perl-statistics-descriptive
- perl-html-parser
