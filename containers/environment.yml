name: sif
channels:
- conda-forge
- bioconda
- nodefaults
dependencies:
- repeatmasker ==4.2.3
- repeatmodeler ==2.0.8
- minimap2 ==2.30
- gmap ==2025.07.31
- star ==2.7.11b
- samtools ==1.23.1
- bcftools ==1.23.1
- bedtools ==2.31.1
- htslib ==1.23.1
- gffread ==0.12.9
- snakemake ==9.21.0
- snakemake-executor-plugin-slurm ==2.6.1
# Perl module deps for JAMg's bin/*.pl scripts come from apt in
# jamg-base.def (system-perl 5.40 has wider package coverage than
# bioconda perl-* and avoids the perl-bio-samtools <-> samtools 1.23
# solver conflict). conda-perl users get DB_File from perl-core.
# JAMg's bin/*.pl scripts use `#!/usr/bin/env perl` so they pick up
# whichever perl is first on PATH; jamg.def's %environment prepends
# /usr/bin to that PATH so system-perl 5.40 wins.
